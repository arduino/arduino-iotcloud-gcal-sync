name: Deploy gcalwatch to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'gcalwatch.py'
      - 'gcalclient.py'
      - 'roomstatus.py'
      - 'mylogger.py'
      - 'requirements.txt'
      - 'docker/gcalwatch.Dockerfile'
      - '.github/workflows/deploy-gcalwatch.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -f docker/gcalwatch.Dockerfile \
            -t ${{ vars.GCALWATCH_IMAGE }}:${{ github.sha }} \
            -t ${{ vars.GCALWATCH_IMAGE }}:latest .
          docker push ${{ vars.GCALWATCH_IMAGE }}:${{ github.sha }}
          docker push ${{ vars.GCALWATCH_IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ vars.GCALWATCH_SERVICE_NAME }} \
            --image ${{ vars.GCALWATCH_IMAGE }}:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} \
            --max-instances 1 \
            --allow-unauthenticated \
            --service-account ${{ vars.GCP_SERVICE_ACCOUNT }} \
            --project ${{ vars.GCP_PROJECT_ID }}
