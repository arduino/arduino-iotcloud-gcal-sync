name: Deploy updater to Compute Engine

on:
  push:
    branches: [main]
    paths:
      - 'updater.py'
      - 'gcalclient.py'
      - 'iotclient.py'
      - 'calendarmap.py'
      - 'receiver_task.py'
      - 'roomstatus.py'
      - 'mylogger.py'
      - 'requirements.txt'
      - 'docker/updater.Dockerfile'
      - '.github/workflows/deploy-updater.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -f docker/updater.Dockerfile \
            -t ${{ vars.UPDATER_IMAGE }}:${{ github.sha }} \
            -t ${{ vars.UPDATER_IMAGE }}:latest .
          docker push ${{ vars.UPDATER_IMAGE }}:${{ github.sha }}
          docker push ${{ vars.UPDATER_IMAGE }}:latest

      - name: Update container on Compute Engine VM
        run: |
          gcloud compute instances update-container ${{ vars.GCE_VM_NAME }} \
            --zone ${{ vars.GCE_ZONE }} \
            --container-image ${{ vars.UPDATER_IMAGE }}:${{ github.sha }} \
            --project ${{ vars.GCP_PROJECT_ID }}
